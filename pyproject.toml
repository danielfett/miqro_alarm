[project]
name = "miqro-alarm"
version = "0.3.0"
description = "A universal alarm service using MQTT as input and output."
authors = [{name = "Daniel Fett", email = "fett@danielfett.de"}]
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "miqro>=1.3.0",
    "requests>=2.28.1",
    "humanfriendly>=10.0",
    # miqro uses the v1 callback API and passes client_id positionally; paho 2.x
    # takes callback_api_version as its first argument and fails at startup.
    "paho-mqtt>=1.6.1,<2",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.poetry]
packages = [{include = "miqro_alarm"}]

[tool.poetry.scripts]
miqro_alarm = { callable = "miqro_alarm:alarm.run" }

[project.scripts]
miqro_alarm = "miqro_alarm:alarm.run"

